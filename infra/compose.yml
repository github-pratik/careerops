services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://careerops:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/careerops
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
    volumes:
      - documents:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 2g
    security_opt: [no-new-privileges:true]
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerops
      POSTGRES_DB: careerops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U careerops -d careerops"]
      interval: 5s
      timeout: 5s
      retries: 15
    mem_limit: 1g
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  documents:
  database:
  certificates:
  caddy_config:
